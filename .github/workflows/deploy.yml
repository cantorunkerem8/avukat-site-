name: Deploy Next.js to cPanel

on:
  push:
    branches:
      - main
      - master

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    
    steps:
    - name: 🚚 Get latest code
      uses: actions/checkout@v4
      
    - name: 🛠️ Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'
        cache: 'npm'
        
    - name: 📦 Install Dependencies
      run: npm ci # Uses package-lock.json for reliable installs
      
    - name: 🏗️ Build Application
      run: npm run build
      
    - name: 🗜️ Prepare Standalone Folder
      run: |
        # Copy necessary public and static files to standalone
        cp -r public .next/standalone/
        cp -r .next/static .next/standalone/.next/
        
        # cPanel (Phusion Passenger) automatically restarts the app if tmp/restart.txt is modified
        # Creating this so the server automatically restarts upon new deployment
        mkdir -p .next/standalone/tmp
        touch .next/standalone/tmp/restart.txt
        
    - name: 📂 Deploy via FTP to cPanel
      uses: SamKirkland/FTP-Deploy-Action@v4.3.5
      with:
        server: ${{ secrets.FTP_SERVER }}
        username: ${{ secrets.FTP_USERNAME }}
        password: ${{ secrets.FTP_PASSWORD }}
        server-dir: /app/ # Matches the folder name you created in cPanel
        local-dir: .next/standalone/
        dangerous-clean-slate: false # Prevents deleting other vital hosting settings files if any
